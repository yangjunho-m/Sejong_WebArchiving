<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방명록 개선안</title><style>
@font-face{font-family:Pretendard;src:url('../../Web/font/PretendardVariable.woff2');font-weight:100 900}@font-face{font-family:Avant;src:url('../../Web/font/ITC Avant Garde Gothic LT Demi.ttf');font-weight:600}*{box-sizing:border-box}body{margin:0;color:#141414;font:16px/1.5 Pretendard,sans-serif;background:linear-gradient(180deg,#f0f3f7 11%,#b5c9ea 57%,#7eacf2 90%)}header{height:89px;padding:24px 60px;display:flex;align-items:center;justify-content:space-between}header img{width:169px;height:41px}nav{display:flex;width:650px;justify-content:space-between;font:600 18px Avant,sans-serif}nav span{opacity:.55}nav .active{opacity:1}main{padding:60px 60px 100px}.compose{max-width:1096px;margin:0 auto 64px}h1{font-size:32px;line-height:1.3;margin:0 0 12px;font-weight:600;letter-spacing:-.02em}.intro{margin:0 0 32px;color:#555}.form-top{display:flex;align-items:center;gap:20px;margin-bottom:16px}.field{background:white;border:1px solid #cacaca;border-radius:30px;padding:18px 24px;font:500 16px/1.5 Pretendard;color:#999}.nick{width:203px;height:60px}.message{width:100%;height:120px;resize:none;border-radius:20px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.hint{font-size:14px;color:#777}.btn{border:0;border-radius:999px;padding:18px 30px;background:#5591f3;color:white;font:500 16px/1.5 Pretendard;cursor:pointer}.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.list-head h2{font-size:22px;margin:0;font-weight:600}.list-head small{color:#777;font-size:14px}.columns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.column{display:flex;flex-direction:column;gap:20px}.card{background:rgba(255,255,255,.8);border-radius:20px;padding:20px;font-size:16px;letter-spacing:-.02em}.card p{margin:0 0 10px;white-space:pre-line}.card .author{color:#777;font-weight:500;margin:0}.more{text-align:center;margin:48px 0 0}.more button{background:rgba(255,255,255,.8);border:1px solid #cacaca;color:#141414}footer{height:315px;background:#141414;color:#e4e4e4;padding:60px;position:relative;display:grid;grid-template-columns:repeat(6,1fr);font:600 16px/1.4 Avant,sans-serif}footer img{width:36px}footer .address{grid-column:5/7;font-size:16px}footer .copyright{position:absolute;bottom:60px;width:100%;text-align:center;font:500 14px/1.5 Pretendard}.status{color:#141414;font-size:14px;margin-top:12px;min-height:21px}@media(max-width:900px){header{padding:24px}nav{width:auto;gap:16px;font-size:12px}main{padding:40px 24px}.columns{grid-template-columns:repeat(2,1fr)}footer{padding:40px 24px}.hint{font-size:12px}}@media(max-width:600px){nav{display:none}h1{font-size:26px}.columns{grid-template-columns:1fr}.actions{align-items:flex-start;gap:12px}.hint{max-width:160px}.btn{padding:16px 20px}footer{display:flex;flex-wrap:wrap;gap:20px;font-size:12px}footer .address{width:100%}}
</style><header><img src="../../Web/img/home/nav-logo.svg" alt="BUTTON UP!"><nav><span>WORKS</span><span>DESIGNERS</span><span>PROGRAM</span><span class="active">MESSAGE</span><span>PARTNERS</span></nav></header><main><section class="compose"><h1>첫 단추를 끼운 우리에게</h1><p class="intro">졸업생들에게 축하와 응원을 남겨주세요.</p><form id="form"><div class="form-top"><input class="field nick" placeholder="닉네임" maxlength="20" required aria-label="닉네임"></div><textarea class="field message" maxlength="300" placeholder="기억에 남은 작품, 전시를 본 소감, 전하고 싶은 응원을 자유롭게 남겨주세요." required aria-label="응원 메시지"></textarea><div class="actions"><span class="hint">메시지는 방명록에 공개됩니다. <span id="count">0 / 300</span></span><button class="btn">응원 남기기</button></div><div class="status" role="status"></div></form></section><section><div class="list-head"><h2>함께 남긴 응원</h2><select aria-label="정렬" style="border:0;background:transparent;color:#777;font:14px Pretendard"><option>최신순</option><option>오래된순</option></select></div><div class="columns" id="cards"></div><div class="more"><button class="btn" type="button">응원 더 보기</button></div></section></main><footer><img src="../../Web/img/home/sdi-logo-desktop.svg" alt="SDI"><span>INSTAGRAM</span><span>BEHANCE</span><span>VIMEO</span><span class="address">209, Neungdong-ro, Gwangjin-gu, Seoul, Korea<br>iddpt@sejong.ac.kr<br>+82 2 3408 3323</span><span class="copyright">©2026. SEJONG UNIVERSITY DESIGN INNOVATION. ALL RIGHTS RESERVED.</span></footer><script>
const samples=[[['졸전 준비하느라 고생 많았어!\n첫 단추를 끼운 너희의 다음 시작도 응원할게.','친구'],['작품 하나하나에 담긴 고민과 시간이 느껴졌어요. 멋진 전시 잘 보고 갑니다!','전시 관람객']],[['후배님들 수고 많으셨습니다.\n찬란한 미래를 응원합니다.','동문회 일동'],['서로 다른 작업이 하나의 전시로 연결되는 모습이 인상 깊었습니다. 졸업 축하합니다!','디자인을 좋아하는 사람']],[['끝까지 해낸 모두에게 박수를! 앞으로도 자신만의 시선으로 멋진 작업을 이어가길 바랍니다.','선배'],['전시장에서 보고 다시 작품을 살펴보러 왔어요. 오래 기억에 남을 전시입니다.','관람객']],[['너의 첫 시작을 응원해.\n졸업 정말 축하해!','가족'],['준비하는 모습을 지켜봐서 더 뭉클했던 전시. 함께한 모두 고생 많았어요.','친구']]];function card(message,author){const el=document.createElement('article');el.className='card';const p=document.createElement('p');p.textContent=message;const a=document.createElement('p');a.className='author';a.textContent=author;el.append(p,a);return el}for(const items of samples){const col=document.createElement('div');col.className='column';for(const [m,a]of items)col.append(card(m,a));cards.append(col)}document.querySelector('textarea').addEventListener('input',e=>document.querySelector('#count').textContent=e.target.value.length+' / 300');document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const msg=document.querySelector('textarea');const nick=document.querySelector('.nick');cards.firstChild.prepend(card(msg.value,nick.value));document.querySelector('.status').textContent='응원을 남겼어요. 미리보기에서만 표시됩니다.';msg.value='';document.querySelector('#count').textContent='0 / 300';});document.querySelector('.more button').addEventListener('click',()=>{for(let i=0;i<4;i++)cards.children[i].append(card(samples[i][1][0],samples[i][1][1]));});
</script><script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script></html>
