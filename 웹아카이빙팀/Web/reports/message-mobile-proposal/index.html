d"><p>졸전 준비하느라 고생 많았어! 첫 단추를 끼운 너희의 다음 시작도 응원할게.</p><div class="meta"><span>친구</span><span class="date">2026. 10. 11</span></div></article><article class="card"><p>작품 하나하나에 담긴 고민과 시간이 느껴졌어요. 멋진 전시 잘 보고 갑니다!</p><div class="meta"><span>전시 관람객</span><span class="date">2026. 10. 11</span></div></article><article class="card"><p>후배님들 수고 많으셨습니다. 찬란한 미래를 응원합니다.</p><div class="meta"><span>동문회 일동</span><span class="date">2026. 10. 11</span></div></article></div><div class="more">응원 더 보기</div></section></main></body></html>
