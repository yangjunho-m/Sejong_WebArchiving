<style>@font-face{font-family:Pretendard;src:url("../font/PretendardVariable.woff2") format("woff2");font-weight:100 900;font-style:normal;}</style></head>
<body class="work-detail-page">
  <main class="work-detail-main">
    <aside class="work-detail-sidebar">
      <header class="work-detail-side-header">
        <a class="work-detail-logo site-logo" href="../" aria-label="Button Up home"><img src="../img/buttonup.svg" alt="BUTTON UP!"></a>
        <a class="work-detail-back" href="work.html" aria-label="Works로 돌아가기">←</a>
      </header>

      <section class="work-detail-info">
        <h1 id="project-name"></h1>
        <div class="work-detail-tags" aria-label="Project tags"></div>
        <div class="work-detail-authors" id="project-authors"></div>
        <p class="work-detail-desc" hidden></p>
      </section>
    </aside>

    <section class="work-detail-content">
      <header class="work-detail-header">
        <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav lang="en" class="site-nav" aria-label="Project detail navigation">
          <a class="type-nav" href="work.html" aria-current="page">WORKS</a>
          <a class="type-nav" href="designers.html">DESIGNERS</a>
          <a class="type-nav" href="program.html">PROGRAM</a>
          <a class="type-nav" href="partners.html">PARTNERS</a>
          <a class="type-nav" href="message.html">MESSAGE</a>
        </nav>
      </header>

      <article class="project-detail-article submitted-project" aria-label="작품 상세 이미지"></article>
    </section>
  </main>

  <footer id="footer"></footer>
  <script src="../js/footer.js?v=20261014-auto-group"></script>
  <script src="../js/script.js?v=20261014-mobile-outside-close"></script>
  <script src="../js/work-detail.js?v=20261020-webp-thumbnails"></script>
<script>
if(location.hash.includes('figmacapture=')) (async()=>{
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const category=new URLSearchParams(location.search).get('finalCategory');
 if(category&&typeof showWork==='function')showWork(category);
 for(let i=0;i<100;i++){
  const ready=location.pathname.includes('work.html')?document.querySelector('.project-card'):location.pathname.includes('designers.html')?document.querySelector('.designer-card'):location.pathname.includes('designer-detail.html')?document.querySelector('.detail-work-card'):location.pathname.includes('work-detail.html')?document.querySelector('.project-detail-article img'):true;
  if(ready && document.querySelector('footer.site-footer') && (innerWidth<=700 || getComputedStyle(document.querySelector('footer')).paddingTop==='40px'))break;if(i===99)return;await sleep(200);
 }
 document.querySelectorAll('img').forEach(n=>n.loading='eager');
 await Promise.race([document.fonts.ready,sleep(12000)]);
 await Promise.race([Promise.all([...document.images].map(n=>n.complete?Promise.resolve():new Promise(r=>{n.onload=r;n.onerror=r;}))),sleep(12000)]);
 document.title=(innerWidth<=700?'MO':'PC')+' / '+document.title+(category?' / '+category:'');const capture=document.createElement('script');capture.src='https://mcp.figma.com/mcp/html-to-design/capture.js';capture.async=true;document.head.append(capture);
})();
</script>
</body>
