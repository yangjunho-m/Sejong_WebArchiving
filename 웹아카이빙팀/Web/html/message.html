<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MESSAGE — BUTTON UP!</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/logo.css">
  <link rel="stylesheet" href="../css/assets.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/message.css">
    <!-- 공통 메뉴 서체: 모든 페이지에서 동일한 설정 사용 -->
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/mobile-layout.css">
    <link rel="stylesheet" href="../css/text-wrap.css">
</head>
<body class="message-page">
  <header class="message-header">
    <a class="logo site-logo" href="../" aria-label="Button Up home">
      <img src="../img/buttonup.svg" alt="BUTTON UP!">
    </a>
    <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav lang="en" class="site-nav" aria-label="Message navigation">
      <a class="type-nav" href="work.html">WORKS</a>
      <a class="type-nav" href="designers.html">DESIGNERS</a>
      <a class="type-nav" href="program.html">PROGRAM</a>
      <a class="type-nav" href="message.html" aria-current="page">MESSAGE</a>
      <a class="type-nav" href="partners.html">PARTNERS</a>
    </nav>
  </header>

  <main class="message-main">
    <h1>MESSAGE</h1>
    <form class="message-form" id="message-form">
      <div class="message-fields">
        <label class="sr-only" for="nickname">닉네임</label>
        <input id="nickname" name="nickname" type="text" maxlength="20" placeholder="닉네임을 입력하세요." required>
        <label class="sr-only" for="encouragement">응원의 메시지</label>
        <textarea id="encouragement" name="encouragement" rows="1" maxlength="300" placeholder="메시지를 입력하세요." required></textarea>
      </div>
      <button type="submit">전송하기</button>
    </form>
    <p id="message-status" class="message-status" aria-live="polite"></p>
    <section id="message-board" class="message-board" aria-label="응원 메시지"></section>
  </main>

  <footer id="footer"></footer>
  <script src="../js/footer.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/message-api-config.js"></script>
  <script src="../js/message.js"></script>
</body>
</html>
