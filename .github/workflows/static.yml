# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/interaction

          WEB_DIR="$(find . -maxdepth 3 -type f -path '*/Web/index.html' -printf '%h\n' | head -n 1)"
          INTERACTION_DIR="$(find . -maxdepth 3 -type f -name package.json -exec grep -l '"button-up-interaction"' {} \; | xargs -r dirname | head -n 1)"

          test -n "$WEB_DIR"
          test -n "$INTERACTION_DIR"

          cp -a "$WEB_DIR/." _site/
          cp -a "$INTERACTION_DIR/index.html" _site/interaction/
          cp -a "$INTERACTION_DIR/data" _site/interaction/
          cp -a "$INTERACTION_DIR/font" _site/interaction/
          cp -a "$INTERACTION_DIR/img" _site/interaction/
          cp -a "$INTERACTION_DIR/scripts" _site/interaction/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
